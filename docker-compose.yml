version: "3.9"

services:
  smart-fitness-health:
    build: .
    image: smart-fitness-health:latest
    container_name: smart-fitness-health-container
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database file between container restarts
      - fitness-data:/app/data
    restart: unless-stopped

volumes:
  fitness-data:
